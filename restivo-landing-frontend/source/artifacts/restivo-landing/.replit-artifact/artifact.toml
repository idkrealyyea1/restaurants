kind = "web"
previewPath = "/"
title = "Mohand Restaurant Menu"
description = "An Arabic-first guest restaurant menu for browsing dishes, building an order, and sharing it when the restaurant is open."
version = "1.0.0"
id = "artifacts/restivo-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23934

[services.development]
run = "pnpm --filter @workspace/restivo-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/restivo-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/restivo-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23934"
BASE_PATH = "/"
