<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="api-base" content="">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>تسجيل الدخول — Ordora</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/skeleton.css">
<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z2fb5o8ctn");
</script>
</head>
<body>
  <!-- Skeleton loader: visible until page fully loads / offline handling -->
  <div id="app-skeleton" aria-hidden="false" aria-label="جارٍ التحميل">
    <div class="sk-skeleton-topbar">
      <div class="sk-logo shimmer" aria-hidden="true"></div>
      <div class="sk-brand shimmer"></div>
      <div class="sk-nav" aria-hidden="true"><span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span></div>
      <div class="sk-actions"><span class="sk-btn shimmer"></span><span class="sk-btn shimmer" style="width:110px"></span></div>
    </div>
    <div class="sk-hero">
      <div class="sk-hero-left">
        <div class="sk-pill shimmer"></div>
        <div class="sk-h1 shimmer"></div><div class="sk-h1-2 shimmer"></div>
        <div class="sk-p shimmer"></div><div class="sk-p-2 shimmer"></div>
        <div class="sk-cta"><span class="shimmer"></span><span class="shimmer"></span></div>
      </div>
      <div class="sk-visual shimmer"><div class="sk-phone shimmer"></div><div class="sk-card shimmer"></div><div class="sk-card shimmer"></div><div class="sk-card shimmer"></div></div>
    </div>
    <div class="sk-cards"><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div></div>
  </div>
  <div id="sk-offline" class="sk-offline" role="status" aria-live="polite">يبدو أنك غير متصل — تحقق من اتصالك <button id="sk-offline-retry" type="button">إعادة المحاولة</button></div>
  <div id="sk-retry" class="sk-retry" role="alert"><p style="margin:0 0 8px; font-weight:700">الاتصال بطيء أو غير متاح</p><p class="muted small" style="margin:0 0 12px">الصفحة تستغرق وقتًا أطول من المعتاد. تحقق من اتصالك أو حاول مجددًا.</p><button id="sk-retry-btn" class="btn btn-sm" type="button">إعادة المحاولة</button></div>

  <header class="topbar">
    <div class="topbar-inner container">
      <a class="brand" href="/" data-i18n="brand">Ordora</a>
    </div>
  </header>

  <main class="container mt-3">
    <div class="card">
      <h1 data-i18n="loginHeading">تسجيل الدخول</h1>
      <p class="muted small" data-i18n="loginDesc">أصحاب المطاعم والموظفون — لإدارة القائمة والطلبات والإعدادات.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="identifier" data-i18n="usernameOrEmail">اسم المستخدم أو البريد الإلكتروني</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submit-btn" class="btn btn-block" type="submit" data-i18n="signIn">دخول</button>
      </form>
      <p class="muted small mt-1"><a href="/signup.html" data-i18n="loginNoAccount">ليس لديك حساب؟ أنشئ حسابك</a> · <a href="/contact.html" data-i18n="loginForgot">نسيت كلمة المرور؟ تواصل معنا</a></p>
      <div id="error-box" class="notice notice-error hidden mt-1"></div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/skeleton.js"></script>
</body>
</html>
