<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>تسجيل الدخول — منصة المطاعم</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner container">
      <a class="brand" href="/" data-i18n="brand">منصة المطاعم</a>
    </div>
  </header>

  <main class="container mt-3">
    <div class="card">
      <h1 data-i18n="loginHeading">تسجيل الدخول</h1>
      <p class="muted small" data-i18n="loginDesc">أصحاب المطاعم والموظفون — لإدارة القائمة والطلبات والإعدادات.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="identifier" data-i18n="usernameOrEmail">اسم المستخدم أو البريد الإلكتروني</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submit-btn" class="btn btn-block" type="submit" data-i18n="signIn">دخول</button>
      </form>
      <div id="error-box" class="notice notice-error hidden mt-1"></div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
