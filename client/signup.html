<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="api-base" content="">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ابدأ متجرك — Ordora</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/skeleton.css">
<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z2fb5o8ctn");
</script>
</head>
<body>
  <div id="app-skeleton" aria-hidden="false" aria-label="جارٍ التحميل">
    <div class="sk-skeleton-topbar">
      <div class="sk-logo shimmer" aria-hidden="true"></div>
      <div class="sk-brand shimmer"></div>
      <div class="sk-nav" aria-hidden="true"><span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span></div>
      <div class="sk-actions"><span class="sk-btn shimmer"></span><span class="sk-btn shimmer" style="width:110px"></span></div>
    </div>
    <div class="sk-hero">
      <div class="sk-hero-left">
        <div class="sk-pill shimmer"></div>
        <div class="sk-h1 shimmer"></div><div class="sk-h1-2 shimmer"></div>
        <div class="sk-p shimmer"></div><div class="sk-p-2 shimmer"></div>
        <div class="sk-cta"><span class="shimmer"></span><span class="shimmer"></span></div>
      </div>
      <div class="sk-visual shimmer"><div class="sk-phone shimmer"></div><div class="sk-card shimmer"></div><div class="sk-card shimmer"></div><div class="sk-card shimmer"></div></div>
    </div>
    <div class="sk-cards"><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div></div>
  </div>
  <div id="sk-offline" class="sk-offline" role="status" aria-live="polite">يبدو أنك غير متصل — تحقق من اتصالك <button id="sk-offline-retry" type="button">إعادة المحاولة</button></div>
  <div id="sk-retry" class="sk-retry" role="alert"><p style="margin:0 0 8px; font-weight:700">الاتصال بطيء أو غير متاح</p><p class="muted small" style="margin:0 0 12px">الصفحة تستغرق وقتًا أطول من المعتاد. تحقق من اتصالك أو حاول مجددًا.</p><button id="sk-retry-btn" class="btn btn-sm" type="button">إعادة المحاولة</button></div>

  <header class="topbar">
    <div class="topbar-inner container">
      <a class="brand" href="/" data-i18n="brand">Ordora</a>
    </div>
  </header>

  <main class="container mt-3">
    <div class="card">
      <div id="su-progress" class="muted small" role="status" aria-live="polite"></div>
      <!-- Static fallback (Oct 2026 blank-page fix): the account form is
           visible in plain HTML before any JavaScript or API response, so
           "Start free" never lands on an empty card. signup.js replaces
           this block immediately on load with the live wizard. -->
      <div id="su-step">
        <h1>أنشئ حسابك</h1>
        <p class="muted small">هذا الحساب سيكون مالك متجرك.</p>
        <div class="field"><label for="f-username">اسم المستخدم</label><input id="f-username" type="text" autocomplete="username" required></div>
        <div class="field"><label for="f-password">كلمة المرور</label><input id="f-password" type="password" autocomplete="new-password" required><p class="muted small">10 أحرف على الأقل.</p></div>
      </div>
      <p id="su-loading" class="muted small" role="status">جارٍ التحقق من جلستك…</p>
      <div id="su-nav" class="flex-between mt-2">
        <button id="su-back" type="button" class="btn btn-outline" data-i18n="su_back">رجوع</button>
        <button id="su-next" type="button" class="btn btn-primary" data-i18n="su_continue">متابعة</button>
      </div>
      <div id="su-error" class="notice notice-error hidden mt-1" role="alert"></div>
    </div>
    <p class="muted small mt-1"><a href="/login.html" data-i18n="su_haveAccount">لدي حساب — تسجيل الدخول</a></p>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/signup.js"></script>
  <script src="/js/skeleton.js"></script>
</body>
</html>
