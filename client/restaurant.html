<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22211d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <title>المطعم</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body class="storefront">
  <div class="page-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner container">
      <span class="spacer"></span>
    </div>
  </header>

  <!-- Hero is rendered by JS -->
  <div id="hero"></div>

  <main class="container">
    <div id="notice-zone"></div>
    <div class="sf-chips" id="chips"></div>

    <div id="menu-zone" class="mt-1"></div>
    <p class="footer-note" data-i18n="poweredBy">مدعوم من منصة المطاعم</p>
  </main>

  <!-- Floating cart bar -->
  <div id="cart-bar" class="sf-cartbar hidden">
    <div class="sf-cartbar-inner">
      <span id="cart-summary" class="sf-cart-summary"></span>
      <button id="open-cart-btn" type="button" class="sf-cart-go" data-i18n="viewCart">عرض السلة</button>
    </div>
  </div>

  <!-- Cart / checkout / success sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/restaurant.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
