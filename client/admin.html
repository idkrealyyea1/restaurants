<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner container">
      <img id="brand-logo" class="logo-sm hidden" src="" alt="">
      <span class="brand" id="restaurant-name">Dashboard</span>
      <span id="open-badge"></span>
      <span class="spacer"></span>
      <button id="logout-btn" type="button" class="btn btn-outline btn-sm">Log out</button>
    </div>
  </header>

  <div class="dash-layout">
    <nav class="dash-side" aria-label="Sections">
      <button class="side-link active" data-tab="dashboard">Dashboard</button>
      <button class="side-link" data-tab="orders">Orders <span id="orders-live-dot" class="badge badge-open hidden">live</span></button>
      <button class="side-link" data-tab="menu">Menu</button>
      <button class="side-link" data-tab="settings">Settings</button>
      <button class="side-link" data-tab="analytics">Analytics</button>
      <button class="side-link" data-tab="share">Share &amp; QR</button>
    </nav>

    <main class="dash-main">
      <div class="tabs-mobile">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="orders">Orders</button>
        <button class="tab-btn" data-tab="menu">Menu</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
        <button class="tab-btn" data-tab="analytics">Analytics</button>
        <button class="tab-btn" data-tab="share">Share</button>
      </div>

      <div class="container mt-2">
        <section id="tab-dashboard"></section>
        <section id="tab-orders" class="hidden"></section>
        <section id="tab-menu" class="hidden"></section>
        <section id="tab-settings" class="hidden"></section>
        <section id="tab-analytics" class="hidden"></section>
        <section id="tab-share" class="hidden"></section>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
